name: Publish Roozlet release
on:
  push:
    branches: [main]
    paths: ['src/rooz/__init__.py', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 tzdata libfontconfig1 xvfb dbus-x11
      - name: Logic and data
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 scripts/validate-data.py
      - name: GTK smoke
        run: xvfb-run -a ./scripts/test-gui.sh
      - name: Build package
        run: |
          ./scripts/build-deb.sh
          python3 scripts/source-archive.py
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rooz-tagged-release
          path: |
            dist/*.deb
            dist/*-source.tar.gz
            dist/SHA256SUMS
      - name: Publish Roozlet downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(PYTHONPATH=src python3 -c 'from rooz import __version__; print(__version__)')
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Release tag does not match application version" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Roozlet $VERSION" --notes-file "docs/releases/$TAG.md"
            gh release upload "$TAG" "dist/roozlet_${VERSION}-1_all.deb" "dist/roozlet-${VERSION}-source.tar.gz" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" "dist/roozlet_${VERSION}-1_all.deb" "dist/roozlet-${VERSION}-source.tar.gz" dist/SHA256SUMS \
              --draft --target "$GITHUB_SHA" --title "Roozlet $VERSION" --notes-file "docs/releases/$TAG.md"
          fi
          gh release edit "$TAG" --draft=false --latest
