[project]
name = "rooz"
dynamic = ["version"]
description = "Compact offline Persian calendar for Xfce"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [{name = "Saeed Taheri"}]

[project.urls]
Repository = "https://github.com/saeedt20/Roozlet"
Issues = "https://github.com/saeedt20/Roozlet/issues"

[tool.setuptools.dynamic]
version = {attr = "rooz.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
